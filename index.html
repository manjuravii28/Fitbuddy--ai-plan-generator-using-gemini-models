<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitBuddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{--ink:#14201b;--paper:#f3f5ef;--court:#1f5c4a;--clay:#e8ff5a;--line:#cdd5c8;--mute:#5d6a63}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 'Newsreader',Georgia,serif}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px;display:grid;grid-template-columns:340px 1fr;gap:40px}
h1{font:900 clamp(56px,9vw,120px)/.85 'Archivo',sans-serif;font-stretch:62%;letter-spacing:-.01em;margin:0 0 28px;grid-column:1/-1;text-transform:uppercase}
h1 span{background:var(--clay);padding:0 .12em}
form{display:flex;flex-direction:column;gap:16px;align-self:start;position:sticky;top:20px}
label{font:600 14px 'Archivo',sans-serif;display:flex;flex-direction:column;gap:6px}
select,input{font:inherit;padding:10px 12px;border:2px solid var(--ink);background:#fff;border-radius:0}
select:focus,input:focus,button:focus-visible{outline:3px solid var(--court);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:800 18px 'Archivo',sans-serif;background:var(--ink);color:var(--clay);border:0;padding:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#out{min-height:200px}
.empty,.err{color:var(--mute);border-left:4px solid var(--line);padding-left:16px}
.err{color:#9b1c1c;border-color:#9b1c1c}
.sum{font-size:21px;margin:0 0 24px}
.day{border-top:3px solid var(--ink);padding:14px 0 18px}
.day h3{font:800 22px 'Archivo',sans-serif;margin:0}
.day .focus{color:var(--court);font-weight:500;margin:0 0 8px}
.day.rest{opacity:.65}
table{width:100%;border-collapse:collapse;font-size:16px}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-weight:500}td.s{white-space:nowrap;font-family:'Archivo',sans-serif;font-weight:600}
td.m{color:var(--mute);font-size:15px}
.nut{background:var(--court);color:#fff;padding:20px 24px;margin-top:24px}
.nut h3{font:800 22px 'Archivo',sans-serif;margin:0 0 8px}
.nut li{margin:6px 0}
.note{font-size:14px;color:var(--mute);margin-top:20px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}form{position:static}}
</style>
</head>
<body>
<main class="wrap">
<h1>Fit<span>Buddy</span></h1>
<form id="f">
  <label>Goal
    <select name="goal">
      <option value="weight_loss">Lose weight</option>
      <option value="muscle_gain">Build muscle</option>
      <option value="general_wellness">Feel better overall</option>
    </select></label>
  <label>Experience
    <select name="level"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select></label>
  <div class="row">
    <label>Days / week<input type="number" name="days_per_week" min="1" max="7" value="4"></label>
    <label>Minutes / session<input type="number" name="minutes_per_session" min="15" max="120" step="5" value="45"></label>
  </div>
  <label>Equipment
    <select name="equipment"><option value="none">None (bodyweight)</option><option value="home_basics">Home basics (dumbbells, bands)</option><option value="full_gym">Full gym</option></select></label>
  <label>Diet<input name="diet" value="no restrictions" maxlength="80" placeholder="e.g. vegetarian"></label>
  <button id="go">Build my plan</button>
</form>
<section id="out" aria-live="polite"><p class="empty">Choose a goal and build your first week.</p></section>
</main>
<script>
const f=document.getElementById('f'),out=document.getElementById('out'),go=document.getElementById('go');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(f));
  d.days_per_week=+d.days_per_week;d.minutes_per_session=+d.minutes_per_session;
  go.disabled=true;go.textContent='Building…';
  out.innerHTML='<p class="empty">Building your plan. This takes a few seconds.</p>';
  try{
    const r=await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
    const j=await r.json();
    if(!r.ok)throw new Error(j.detail||'Request failed');
    render(j);
  }catch(err){out.innerHTML=`<p class="err">${esc(err.message)}</p>`}
  go.disabled=false;go.textContent='Build my plan';
});
function render(p){
  const days=(p.weekly_plan||[]).map(d=>{
    const ex=d.exercises||[];
    return `<div class="day${ex.length?'':' rest'}"><h3>${esc(d.day)}</h3><p class="focus">${esc(d.focus)}</p>`+
    (ex.length?`<table>${ex.map(x=>`<tr><td class="n">${esc(x.name)}</td><td class="s">${esc(x.sets)} × ${esc(x.reps)}</td><td class="m">${esc(x.notes)}</td></tr>`).join('')}</table>`:'')+`</div>`;
  }).join('');
  out.innerHTML=`<p class="sum">${esc(p.summary)}</p>${days}
  <div class="nut"><h3>Nutrition tips</h3><ul>${(p.nutrition_tips||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
  <p class="note">${esc(p.safety_note)}</p>`;
}
</script>
</body>
</html>
